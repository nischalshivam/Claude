<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research-First Clip Tool — Editor</title>
<style>
:root{
  --bg:#0e1116; --panel:#151a22; --panel2:#1b222c; --line:#242c38; --line2:#2f3948;
  --txt:#e6e9ef; --muted:#8b95a5; --accent:#6741ff; --accent2:#2b6cb0;
  --green:#2f9e44; --blue:#2f7de1; --purple:#9c6bff; --orange:#e87a0c; --red:#e03131; --teal:#0ca678; --grey:#5a6472;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13.5px/1.55 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
button{font:inherit;cursor:pointer;border:0;border-radius:7px;padding:7px 13px;background:var(--panel2);color:var(--txt);border:1px solid var(--line2)}
button:hover{border-color:#3a4658}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.go{background:var(--green);border-color:var(--green);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:#74a9ff}
code{background:#0b0e14;padding:1px 5px;border-radius:4px;color:#aab3c2;font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{display:flex;flex-direction:column;height:100vh}

/* header */
header{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#6741ff,#2b6cb0)}
header .title{font-weight:700}
header .spacer{flex:1}
.state-badge{padding:4px 11px;border-radius:20px;font-weight:700;font-size:12px;border:1px solid}
.save{color:var(--muted);font-size:12px}

/* nav + body */
.body{display:flex;flex:1;min-height:0}
nav{width:74px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:8px 0;gap:2px}
nav button{background:none;border:0;border-radius:0;width:100%;padding:11px 4px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px}
nav button.active{color:#fff;background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
nav .ico{font-size:17px}
main{flex:1;min-width:0;overflow:auto;padding:18px 22px}
main.editor{padding:0;overflow:hidden}

h2{font-size:16px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kv:last-child{border:0}
.kv .k{color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700}
.pill.ok{background:#12351d;color:#8ce99a}.pill.warn{background:#33280f;color:#ffd8a8}.pill.bad{background:#33161a;color:#ffc9c9}.pill.info{background:#12283f;color:#9ecbff}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
pre.log{background:#0b0e14;border:1px solid var(--line);border-radius:8px;padding:12px;max-height:320px;overflow:auto;font-size:11.5px;color:#aab3c2;white-space:pre-wrap}
.bar{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 14px}

/* missing cards */
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:0 0 12px}
.mcard.block{border-color:var(--orange)} .mcard.ready{border-color:var(--green)}
.mcard h3{font-size:14px;margin:0 0 5px;display:flex;gap:8px;align-items:center}
.crit{background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px}
.cue{color:#dfe5ef;margin:6px 0;font-style:italic}
.why{color:#ffb3b3;font-size:12px;margin:3px 0}
.note{color:var(--muted);font-size:12px;margin:3px 0}
.drop{border:2px dashed var(--line2);border-radius:9px;padding:16px;text-align:center;color:var(--muted);margin:9px 0;cursor:pointer}
.drop.over{border-color:var(--accent2);color:#9ecbff;background:#141c28}
.files{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumb{width:96px;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:#0b0e14}
.thumb img{width:100%;display:block;height:56px;object-fit:cover}
.thumb .n{font-size:10px;color:var(--muted);padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.approve{display:flex;gap:8px;align-items:flex-start;background:#2a1416;border:1px solid var(--red);border-radius:8px;padding:9px 11px;margin:8px 0;color:#ffc9c9}
.approve.done{background:#12351d;border-color:var(--green);color:#8ce99a}
.approve.expired{background:#33280f;border-color:var(--orange);color:#ffd8a8}
label.inline{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12.5px;margin:6px 0}
.search a{margin-right:9px}

/* editor layout */
.ed{display:grid;grid-template-rows:1fr 210px;height:100%}
.ed-top{display:grid;grid-template-columns:230px 1fr 290px;min-height:0}
.ed-left,.ed-right{background:var(--panel);overflow:auto;padding:10px}
.ed-left{border-right:1px solid var(--line)} .ed-right{border-left:1px solid var(--line)}
.ed-center{display:flex;flex-direction:column;min-width:0;background:#0b0e14}
.preview{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.preview video,.preview img{max-width:100%;max-height:100%;background:#000}
.preview .empty{color:var(--muted)}
.prov{position:absolute;top:10px;left:10px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(0,0,0,.6)}
.ed-timeline{background:var(--panel);border-top:1px solid var(--line);overflow:auto;padding:8px 10px}
.track-row{display:flex;align-items:center;gap:8px;margin:4px 0}
.track-lbl{width:70px;font-size:10.5px;color:var(--muted);flex:none;text-transform:uppercase}
.strip{display:flex;gap:2px;flex:1;overflow-x:auto;padding-bottom:4px}
.clip{height:44px;border-radius:4px;flex:none;min-width:22px;border:2px solid transparent;position:relative;overflow:hidden;cursor:pointer;background-size:cover;background-position:center}
.clip.sel{border-color:#fff}
.clip .tag{position:absolute;left:2px;bottom:1px;font-size:9px;background:rgba(0,0,0,.6);padding:0 3px;border-radius:3px}
.o-AUTO_EXACT{outline:2px solid var(--green)}
.field{margin:9px 0}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.field input[type=range]{width:100%}
.field select,.field input[type=number]{width:100%;background:#0b0e14;border:1px solid var(--line2);color:var(--txt);border-radius:6px;padding:5px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:3px;vertical-align:-1px}
.toast{position:fixed;bottom:16px;right:16px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px 14px;font-size:12.5px;max-width:360px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast.bad{border-color:var(--red);color:#ffc9c9}.toast.ok{border-color:var(--green);color:#8ce99a}
.muted{color:var(--muted)}
.small{font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"></div>
    <div class="title">Research-First Clip Tool</div>
    <span id="stateBadge" class="state-badge">…</span>
    <div class="spacer"></div>
    <span id="save" class="save">—</span>
    <button id="btnDraft">Draft banao</button>
    <button id="btnFinal" class="go" disabled>Final banao</button>
  </header>
  <div class="body">
    <nav id="nav">
      <button data-view="overview" class="active"><span class="ico">▤</span>Overview</button>
      <button data-view="health"><span class="ico">✓</span>Research</button>
      <button data-view="missing"><span class="ico">▦</span>Missing</button>
      <button data-view="editor"><span class="ico">▶</span>Editor</button>
    </nav>
    <main id="main"><div class="muted">loading…</div></main>
  </div>
</div>
<div id="toast"></div>
<script>window.__RFC__={token:"%%SESSION_TOKEN%%"};</script>
<script src="/app.js"></script>
</body>
</html>
